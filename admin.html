
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crave Admin</title>
<style>
body{margin:0;background:#10120f;color:#f6f4eb;font:15px system-ui;padding:20px}
main{max-width:760px;margin:auto}
.card{background:#191c17;border:1px solid #30352c;border-radius:16px;padding:16px;margin:14px 0}
input{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;background:#10120f;color:white;border:1px solid #444;border-radius:8px}
button{padding:11px 14px;border:0;border-radius:8px;margin:4px;background:#d8fa65;font-weight:bold;cursor:pointer}
.reject{background:#482a27;color:white}
small,.muted{color:#a2a79a}
.notice{color:#ffd66b}
</style>
</head>
<body>
<main>
<h1>crave. Admin</h1>
<p class="muted">Verification review dashboard</p>

<section class="card" id="setup">
<h2>Connect Supabase</h2>
<label>Project URL</label>
<input id="url" placeholder="https://YOUR-PROJECT.supabase.co">
<label>Publishable key (or legacy anon key)</label>
<input id="key" type="password" placeholder="Your public client key">
<button id="connect">Connect</button>
<p id="msg" role="status"></p>
</section>

<section class="card" id="login" hidden>
<h2>Admin sign in</h2>
<label>Email</label>
<input id="email" type="email" autocomplete="username">
<label>Password</label>
<input id="password" type="password" autocomplete="current-password">
<button id="signin">Sign in</button>
<p id="loginmsg" role="status"></p>
</section>

<section id="dashboard" hidden>
<div class="card">
<h2>Pending verification submissions</h2>
<p id="who" class="muted"></p>
<button id="refresh">Refresh queue</button>
<button id="logout">Sign out</button>
<p id="status" role="status"></p>
</div>
<div id="queue"></div>
</section>
</main>

<script>
let project='',key='',token='',userEmail='';
const $=id=>document.getElementById(id);
const message=(id,text)=>$(id).textContent=text;

async function request(path,options={}){
 const headers={'apikey':key,'Content-Type':'application/json'};
 if(options.auth)headers.Authorization='Bearer '+token;
 const response=await fetch(project.replace(/\/$/,'')+path,{
  method:options.method||'GET',headers,
  body:options.body?JSON.stringify(options.body):undefined
 });
 const text=await response.text();
 let data;
 try{data=text?JSON.parse(text):null}catch{data=null}
 if(!response.ok)throw Error(data?.message||data?.msg||data?.error_description||text||'Request failed: '+response.status);
 return data;
}

$('connect').onclick=async()=>{
 project=$('url').value.trim();
 key=$('key').value.trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(project)||!key){
  message('msg','Enter a valid project URL and publishable/anon key.');return;
 }
 $('connect').disabled=true;
 try{
  await request('/rest/v1/yap_verification_submissions?select=id&limit=1');
  $('setup').hidden=true;
  $('login').hidden=false;
  message('loginmsg','Connected. Sign in with your Crave administrator account.');
 }catch(e){message('msg','Connection failed: '+e.message)}
 finally{$('connect').disabled=false}
};

$('signin').onclick=async()=>{
 $('signin').disabled=true;
 try{
  const result=await request('/auth/v1/token?grant_type=password',{
   method:'POST',
   body:{email:$('email').value.trim(),password:$('password').value}
  });
  token=result.access_token;
  userEmail=result.user?.email||$('email').value.trim();
  await loadQueue();
  $('login').hidden=true;
  $('dashboard').hidden=false;
  $('who').textContent='Signed in: '+userEmail;
  message('status','Signed in. Admin access is enforced by Supabase.');
  $('password').value='';
 }catch(e){
  token='';
  message('loginmsg','Sign-in or access failed: '+e.message);
 }finally{$('signin').disabled=false}
};

function escapeHTML(value){
 return String(value??'—').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}

async function loadQueue(){
 message('status','Loading pending submissions…');
 $('queue').innerHTML='';
 try{
  const rows=await request(
   '/rest/v1/yap_verification_submissions?select=id,yap_id,method,receipt_reference,accuracy_m,submitted_latitude,submitted_longitude,status,created_at&status=eq.pending&order=created_at.desc',
   {auth:true}
  );
  if(!rows.length){
   $('queue').innerHTML='<div class="card">No pending submissions.</div>';
   message('status','Queue loaded.');
   return;
  }

  const ids=[...new Set(rows.map(r=>r.yap_id).filter(Boolean))];
  const query=ids.map(id=>'"'+id+'"').join(',');
  const yaps=await request(
   '/rest/v1/yaps?select=id,restaurant,dish,area,note,verification_level,verification_status&id=in.('+query+')',
   {auth:true}
  );
  const byId=new Map(yaps.map(y=>[y.id,y]));

  $('queue').innerHTML=rows.map(r=>{
   const y=byId.get(r.yap_id)||{};
   const isTest=String(r.receipt_reference||'').toUpperCase().startsWith('TEST-');
   return '<article class="card"><h2>'+
    escapeHTML(y.dish)+' — '+escapeHTML(y.restaurant)+'</h2>'+
    '<p>Area: '+escapeHTML(y.area)+'</p>'+
    '<p>Method: '+escapeHTML(r.method)+'</p>'+
    '<p>Receipt reference: '+escapeHTML(r.receipt_reference)+'</p>'+
    '<p>GPS accuracy: '+escapeHTML(r.accuracy_m==null?'Not supplied':r.accuracy_m+' m')+'</p>'+
    '<p>Coordinates: '+escapeHTML(r.submitted_latitude==null?'Not supplied':r.submitted_latitude+', '+r.submitted_longitude)+'</p>'+
    '<p>Current level: '+escapeHTML(y.verification_level)+' ('+escapeHTML(y.verification_status)+')</p>'+
    '<p>Note: '+escapeHTML(y.note)+'</p>'+
    (isTest?'<p class="notice">Test reference: approval disabled.</p>':'')+
    '<button data-id="'+escapeHTML(r.id)+'" data-decision="approved" '+(isTest?'disabled':'')+'>Approve evidence</button>'+
    '<button class="reject" data-id="'+escapeHTML(r.id)+'" data-decision="rejected">Reject</button>'+
    '</article>';
  }).join('');
  message('status',rows.length+' pending submission(s). Review evidence carefully.');
 }catch(e){
  message('status','Could not load queue: '+e.message);
 }
}

$('queue').addEventListener('click',async event=>{
 const button=event.target.closest('button[data-decision]');
 if(!button)return;
 const decision=button.dataset.decision;
 if(!confirm('Confirm '+decision+' for this submission?'))return;
 button.disabled=true;
 try{
  await request('/rest/v1/rpc/review_yap_verification',{
   method:'POST',auth:true,
   body:{
    p_submission_id:button.dataset.id,
    p_decision:decision
   }
  });
  message('status','Review saved.');
  await loadQueue();
 }catch(e){
  message('status','Review failed: '+e.message);
  button.disabled=false;
 }
});

$('refresh').onclick=loadQueue;
$('logout').onclick=async()=>{
 try{await request('/auth/v1/logout',{method:'POST',auth:true})}catch{}
 token='';
 $('dashboard').hidden=true;
 $('login').hidden=false;
 message('loginmsg','Signed out.');
};
</script>
</body>
</html>
